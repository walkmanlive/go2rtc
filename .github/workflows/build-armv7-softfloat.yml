name: Build ARMv7 softfloat

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - 'v*'                  # 推送 v1.0.0 这种 tag 时自动发布

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # 允许创建 Release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl
          sudo ln -sf $(which upx-ucl) /usr/local/bin/upx

      - name: Build
        run: |
          export CGO_ENABLED=0
          GOOS=linux GOARCH=arm GOARM=7,softfloat \
            go build -ldflags "-s -w" -trimpath -o go2rtc_linux_armv7eabi
          upx --best --lzma go2rtc_linux_armv7eabi
          ls -lh go2rtc_linux_armv7eabi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: go2rtc-armv7eabi-softfloat
          path: go2rtc_linux_armv7eabi

      # 只有手动触发 或 打了 tag 时才创建 Release
      - name: Create Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('armv7eabi-{0}', github.run_number) }}
          name: go2rtc ARMv7 softfloat ${{ github.ref_type == 'tag' && github.ref_name || format('#{0}', github.run_number) }}
          files: go2rtc_linux_armv7eabi
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
