name: Build ARMv7 softfloat

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'   # 或与官方 go.mod 一致

      - name: Build
        run: |
          export CGO_ENABLED=0
          GOOS=linux GOARCH=arm GOARM=7,softfloat \
            go build -ldflags "-s -w" -trimpath -o go2rtc_linux_armv7eabi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: go2rtc-armv7eabi-softfloat
          path: go2rtc_linux_armv7eabi
